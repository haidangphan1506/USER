services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: backends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backends_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backends_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: backends-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
    name: backend-net